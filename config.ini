[main]
# Категории карточек (через запятую)
categories = python, javascript, java, sql, system_design, algorithms, data_structures, general

# ID категории по умолчанию
category_id = 0

# Пути для документов и вывода
documents = ~/Documents/InterviewCards/
output = ~/Documents/InterviewCards/output/

[directories-linux]
# Путь к Obsidian Vault (Linux/Mac)
obsidian_vault = ~/Documents/ObsidianVault/

# Путь к медиа файлам Anki (Linux/Mac)
anki_collection_media = ~/.local/share/Anki2/User 1/collection.media/

[directories-windows]
# Путь к Obsidian Vault (Windows)
obsidian_vault = ~/Documents/ObsidianVault/

# Путь к медиа файлам Anki (Windows)
anki_collection_media = ~/AppData/Roaming/Anki2/User 1/collection.media/

[limits]
# Максимальное количество вопросов в колоде
max_questions_per_deck = 500

# Максимальная длина вопроса (символы)
max_question_length = 2000

# Максимальная длина ответа (символы)
max_answer_length = 5000

[spaced_repetition]
# Основной тег колоды (формат: #flashcards/...)
card_tag = #flashcards

# Тег темы (устарело, оставлено для совместимости)
topic_tag =

# Префикс тега сложности (устарело)
difficulty_tag_prefix =

[separators]
# Разделители карточек Spaced Repetition
# Single-line Basic: вопрос::ответ
single_line_basic = ::

# Single-line Bidirectional: инфо1:::инфо2 (создает 2 карточки)
single_line_bidirectional = :::

# Multi-line Basic: вопрос\n?\nответ
multi_line_basic = ?

# Multi-line Bidirectional: инфо1\n??\nинфо2 (создает 2 карточки)
multi_line_bidirectional = ??

[cloze]
# Символы для Cloze deletions
# Формат: ==текст== для скрытия
start = ==
end = ==